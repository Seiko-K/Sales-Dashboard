<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <rect width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2937">
    Sales Dashboard
  </text>

  <text x="500" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">
    Reusable Excel sales tracking and KPI reporting workflow
  </text>

  <!-- Input sources -->
  <rect x="120" y="125" width="340" height="80" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="290" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#312e81">
    Daily Sales Input
  </text>
  <text x="290" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4338ca">
    Calls / Emails / Meetings / Sales / Revenue
  </text>

  <rect x="540" y="125" width="340" height="80" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="710" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#14532d">
    Settings &amp; Master Data
  </text>
  <text x="710" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#166534">
    Sales Reps / Status / Products / Targets
  </text>

  <!-- Input connectors -->
  <line x1="290" y1="205" x2="290" y2="240" stroke="#6b7280" stroke-width="3"/>
  <line x1="710" y1="205" x2="710" y2="240" stroke="#6b7280" stroke-width="3"/>
  <line x1="290" y1="240" x2="710" y2="240" stroke="#6b7280" stroke-width="3"/>
  <line x1="500" y1="240" x2="500" y2="265" stroke="#6b7280" stroke-width="3"/>
  <polygon points="500,275 492,260 508,260" fill="#6b7280"/>

  <!-- Processing layer -->
  <rect x="285" y="280" width="430" height="75" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="500" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#164e63">
    Excel Tables &amp; Formula Engine
  </text>
  <text x="500" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0e7490">
    Validation / Aggregation / KPI Calculations
  </text>

  <!-- Branch connectors -->
  <line x1="500" y1="355" x2="500" y2="395" stroke="#6b7280" stroke-width="3"/>
  <line x1="250" y1="395" x2="750" y2="395" stroke="#6b7280" stroke-width="3"/>
  <line x1="250" y1="395" x2="250" y2="420" stroke="#6b7280" stroke-width="3"/>
  <line x1="500" y1="395" x2="500" y2="420" stroke="#6b7280" stroke-width="3"/>
  <line x1="750" y1="395" x2="750" y2="420" stroke="#6b7280" stroke-width="3"/>

  <!-- Output modules -->
  <rect x="110" y="420" width="280" height="70" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="250" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#78350f">
    Weekly Summary
  </text>
  <text x="250" y="473" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#92400e">
    Activity and sales performance
  </text>

  <rect x="360" y="420" width="280" height="70" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">
    Monthly KPI
  </text>
  <text x="500" y="473" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#166534">
    Revenue / Sales / Conversion
  </text>

  <rect x="610" y="420" width="280" height="70" rx="14" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="750" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#831843">
    Target Analysis
  </text>
  <text x="750" y="473" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9d174d">
    Target vs Achievement
  </text>

  <!-- Merge connectors -->
  <line x1="250" y1="490" x2="250" y2="520" stroke="#6b7280" stroke-width="3"/>
  <line x1="500" y1="490" x2="500" y2="520" stroke="#6b7280" stroke-width="3"/>
  <line x1="750" y1="490" x2="750" y2="520" stroke="#6b7280" stroke-width="3"/>
  <line x1="250" y1="520" x2="750" y2="520" stroke="#6b7280" stroke-width="3"/>
  <line x1="500" y1="520" x2="500" y2="540" stroke="#6b7280" stroke-width="3"/>

  <!-- Final dashboard -->
  <rect x="300" y="540" width="400" height="55" rx="16" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="500" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">
    Home Dashboard
  </text>
  <text x="500" y="584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">
    KPI Cards / Charts / Performance Reports
  </text>
</svg>
